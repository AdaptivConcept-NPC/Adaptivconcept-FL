name: Update GitHub Tech Profile

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  push:
    branches: [ main ]
    paths:
      - 'scripts/sync-github-stats.mjs'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: projects/adaptivconcept-npc/Adaptivconcept-FL/adaptivconcept-react

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/adaptivconcept-npc/Adaptivconcept-FL/adaptivconcept-react/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Sync GitHub Stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/sync-github-stats.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-stats.json
          git commit -m "chore: update github tech stats [skip ci]" || echo "No changes to commit"
          git push
